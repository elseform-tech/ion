[package]
name = "ion-desktop"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "ion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
