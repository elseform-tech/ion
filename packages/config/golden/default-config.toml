projects = []

[ion]
quick = "claude-code"
deep = "claude-code"
deepEffort = "high"
useDeep = "auto"

[folders]
projects = "~/ion/projects"

[access]
default = "auto"
judge = "claude-code:haiku"

[resources]
max_runs = "auto"

[notifications.briefing]
on = true
at = "08:30"

[notifications.quiet]
on = true
from = "22:00"
to = "08:00"
