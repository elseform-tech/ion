name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7 ReDoS) has no upstream fix yet. We patch it ourselves:
          # patches/picomatch@4.0.7.patch, tested in tools/health/src/patched-deps.test.js. Dependency
          # review only sees the version, so allow this one advisory. It stays safe because an override pins
          # every copy to 4.0.7 and a test fails if any unpatched copy appears in pnpm-lock.yaml.
          # Remove this, the override and the patch together when picomatch ships a fix.
          allow-ghsas: GHSA-fc5q-39xc-vjpf
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
